name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-and-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:rules
      - run: pnpm build
      - run: pnpm exec wrangler deploy --dry-run --config statistics/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: g++ -std=c++17 -Wall -Wextra tests/cloud_policy_test.cpp -o /tmp/paro-policy && /tmp/paro-policy
      - run: g++ -std=c++17 -Wall -Wextra tests/hopper_journal_test.cpp -o /tmp/paro-hopper && /tmp/paro-hopper
      - run: g++ -std=c++17 -Wall -Wextra tests/home_night_test.cpp -o /tmp/paro-night && /tmp/paro-night
      - run: g++ -std=c++17 -Wall -Wextra tests/device_push_policy_test.cpp -o /tmp/paro-device-push && /tmp/paro-device-push
      - run: g++ -std=c++17 -Wall -Wextra tests/day_cycle_test.cpp -o /tmp/paro-day && /tmp/paro-day
      - run: g++ -std=c++17 -Wall -Wextra tests/return_schedule_test.cpp -o /tmp/paro-return && /tmp/paro-return
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: bash firmware/test/build_and_test.sh
